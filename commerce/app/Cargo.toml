[package]
name = "logis-app"
description = "logis-center 헤드리스 코어: 모델 상주 · 전환(residency · lifecycle), LanceDB 벡터 저장소, 추출 · 무역 스케줄러, Stanza 질의 분석, 검색 융합 · 관계 단계, 진행 이벤트 싱크(EventSink · NoopSink). Tauri 없음 — 창 · 명령 · 브라우저 자동화는 commerce/src-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# 이 crate 의 코드는 GPU 기능을 직접 보지 않습니다. 셸(commerce/src-tauri)의 같은 이름 기능이 여기를 거쳐 모델 crate 를 켭니다.
cuda = ["logis-llm/cuda", "logis-vision-doc/cuda"]
rocm = ["logis-llm/rocm", "logis-vision-doc/rocm"]
vulkan = ["logis-llm/vulkan", "logis-vision-doc/vulkan"]
metal = ["logis-llm/metal", "logis-vision-doc/metal"]
flash-attn = ["logis-llm/flash-attn"]
turbo-quant = ["logis-llm/turbo-quant"]
# 디버그 빌드에서도 모든 언어 도메인 사전(full_bias.json)을 넣습니다 (crates/logis-bias 의 같은 기능).
full-bias = ["logis-bias/full-bias"]

[dependencies]
anyhow = "1.0"
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
base64 = "0.22"
boa_engine = { path = "../crates/boa-engine/core/engine" }
# candle 은 crates.io 이름으로 적고, 루트 Cargo.toml 의 [patch.crates-io] 가 포크 커밋으로 바꿉니다.
candle-core = "0.11.0"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures = "0.3"
image = { version = "0.25", features = ["jpeg", "png"] }
# LanceDB: premium-discount · raon-zena 와 같은 0.41 (lance 14 · datafusion 54). 0.31(lance 8)이 쓴 테이블을 그대로 읽고 이어 씁니다.
# 0.41 의 매니페스트가 serde_json `preserve_order` 를 켜 앱 전체 JSON 맵이 넣은 순서가 되므로, 순서가 드러나는 곳은
# logis_schema::json_order 로 예전(키 정렬) 출력을 지킵니다 (docs/crates-workspace.md).
lancedb = { version = "0.41", default-features = false }
logis-bias.workspace = true
logis-llm.workspace = true
logis-parsers.workspace = true
logis-pug.workspace = true
logis-schema.workspace = true
logis-sds.workspace = true
logis-search.workspace = true
logis-vision-doc.workspace = true
num = "0.4.3"
once_cell = "1.18"
# Stanza 실행기 (src/stanza.rs 는 이 crate 의 stanza 를 감싸는 층). ONNX Runtime 은 실행할 때 불러옴(runtime-load).
premium-discount-nlp = { workspace = true, features = ["stanza"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
rcgen = "0.13"
regex = "1"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
scraper = "0.25.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22.2"
tokio = { version = "1", features = ["full"] }
url = "2.5.7"
uuid = { version = "1.4", features = ["v4"] }
whatlang = "0.18.0"
# Win32_Foundation: GetCurrentProcess · SetProcessWorkingSetSizeEx 가 HANDLE · BOOL 을 써서 이 crate 만 빌드할 때도 필요합니다.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory"] }

# 통합 시험(tests/it, 예전 commerce/src-tauri/tests)이 직접 쓰는 crate. Tauri 없이 코어만 빌드합니다:
#   cargo test -p logis-app --test it --no-default-features [--features rocm|vulkan|metal …]
[dev-dependencies]
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
dirs = "6.0.0"
ggml-kquant = { path = "../crates/ggml-kquant" }
memmap2 = "0.9"
# 시험 바이너리의 전역 할당기 (tests/it/main.rs, 앱 main.rs 와 같음)
mimalloc = { version = "0.1.48", features = ["v3"] }
nvml-wrapper = "0.9.0"
safetensors = "0.4"
sysinfo = "0.30"

[target.'cfg(target_os = "linux")'.dev-dependencies]
io-uring = "0.7.13"
