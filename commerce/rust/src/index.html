<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logis AI Widget</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/assets/favicon.svg?v=18" />
    <link rel="stylesheet" href="styles.css?20" />
    <script src="/ethers.umd.min.js"></script>
    <script src="/qrcode.min.js"></script>
    <script src="/marked.js"></script>
    <script src="/pako.js"></script>
    <script src="/blockies.js"></script>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <div class="widget-wrapper">
      
      <!-- 1. The Pill Nav (Always Visible) -->
      <nav class="pill-nav">
        <div class="logo-section">
            <button id="nav-upload-btn" class="nav-btn" title="Upload Image">➕</button>
        </div>
        
        <!-- Nav Image Preview Container -->
        <div id="nav-preview-container" class="nav-preview-container hidden">
            <img id="nav-img-thumbnail" src="" />
            <button id="nav-img-clear" title="Remove image">✕</button>
        </div>

        <div id="search-container" class="search-container">
            <div id="search-tags-container" class="search-tags-container"></div>
            <input type="text" id="global-search" class="search-input" placeholder="Search or Ask Prompt" />
        </div>
        
        <div class="nav-icons" style="display: flex; align-items: center; gap: 8px;">
          <button id="btn-submit" class="nav-btn" title="AI Search">🔍</button>
          <button id="btn-extract" class="nav-btn" style="display:none; color: var(--primary);" title="Start Extraction">⚡</button>
          <button id="btn-auto-launch" class="nav-btn" title="Open Browser">🌐</button>
          <button id="btn-settings" class="nav-btn" data-tab="settings" title="Config" style="min-width:24px; text-align:center;">🗨️</button>
        </div>
      </nav>

      <!-- 2. The Content Panel (Hidden by default) -->
      <section id="content-panel" class="content-panel">
        
        <!-- Tab: List (Primary View) -->
        <div id="tab-list" class="tab-content active">
           <!-- View 1: List Table -->
           <div id="list-view" style="position: relative;">
               <div class="header-row">
                 <div style="display:flex; align-items:center; gap:10px;">
                    <button id="btn-list-back" class="nav-btn" title="Collapse">⬅︎</button>
                    <h2>Results</h2>
                 </div>
                 <div style="display:flex; gap:5px;">
                    <button id="btn-delete-selected" class="nav-btn" style="display:none; color: #ef4444;" title="Delete Selected">🗑️ All</button>
                    <button id="list-refresh-btn" class="nav-btn" title="Refresh">🔄</button>
                 </div>
               </div>
               
               <div id="list-scroll-container" style="height: 450px; overflow-y: auto; padding: 0 10px;">
                 
                 <!-- Navigation Categories (Users + Pages Tree) -->
                 <div id="nav-categories" class="nav-categories hidden" style="margin-bottom: 20px; padding-bottom: 10px;">
                     <!-- Profile Section -->
                     <div class="nav-profile" style="margin-bottom: 15px;">
                         <div class="profile-card" style="display:flex; align-items:center; gap:10px; background:#1a1a1a; padding:10px; border-radius:8px;">
                             <div class="profile-favicon" id="nav-profile-favicon" style="width:32px; height:32px; background:#333; border-radius:4px;"></div>
                             <div class="profile-info">
                                 <strong id="nav-profile-name" style="font-size:0.9rem;">Sign In</strong>
                             </div>
                             <div style="margin-left:auto;">
                                 <button id="nav-signin" class="link-btn">Login</button>
                                 <button id="nav-signout" class="link-btn hidden">Logout</button>
                             </div>
                         </div>
                     </div>

                     <!-- Tree Sections -->
                     <div class="nav-tree-container">
                         <!-- Device Preference Toggle -->
                         <div id="device-preference-container" style="padding: 5px 10px; margin-bottom: 10px; background: rgba(255,255,255,0.05); border-radius: 6px; display: flex; align-items: center; justify-content: space-between;">
                             <label for="force-cpu-toggle" style="font-size: 0.75rem; color: #aaa; cursor: pointer;">Force CPU Mode</label>
                             <input type="checkbox" id="force-cpu-toggle" style="cursor: pointer;" />
                         </div>

                         <div class="nav-section">
                             <h3 style="font-size:0.75rem; color:#666; text-transform:uppercase; margin-bottom:8px; padding-left:5px;">Shared Pages</h3>
                             <div id="nav-list-pages" class="tree-root"></div>
                         </div>
                         <div class="nav-section" style="margin-top:15px;">
                             <h3 style="font-size:0.75rem; color:#666; text-transform:uppercase; margin-bottom:8px; padding-left:5px;">Team Members</h3>
                             <div id="nav-list-users" class="tree-root"></div>
                         </div>
                     </div>
                 </div>

                 <!-- REPLACED: Table with Div Container for Cards -->
                 <div id="doc-list" class="card-list"></div>
                 
                 <div id="loading-indicator" style="display:none; text-align:center; padding:10px; font-size:0.8rem; color:#666;">Loading...</div>
               </div>
               <!-- AI Results Area -->
               <div id="ai-search-results" style="display:none; margin-top:10px; border-top:1px solid #333; padding-top:10px;">
                    <h3 id="ai-results-title" style="font-size:0.9rem; color:var(--primary);">AI Analysis Results</h3>
                    <div id="ai-results-content" style="font-size:0.8rem; line-height: 1.4;"></div>
               </div>
           </div>

           <!-- View 2: Detail Overlay -->
           <div id="detail-view" style="display:none; height:100%; flex-direction:column;">
               <div class="header-row" style="justify-content: space-between;">
                   <div style="display:flex; align-items:center; gap:10px;">
                       <button id="btn-detail-back" class="nav-btn">⬅︎</button>
                       <h2 id="detail-title">Type No</h2>
                   </div>
                   <div style="display:flex; gap:5px;">
                        <button id="btn-stop-task" class="nav-btn" style="display:none; color: #ef4444;" title="Stop Extraction">🛑</button>
                        <button id="btn-detail-delete" class="nav-btn" style="color: #ef4444;" title="Delete Document">🗑️</button>
                   </div>
               </div>
               <div id="detail-content" class="markdown-body" style="overflow-y:auto; flex:1; font-size: 0.85rem; padding-right:5px;">
                   <!-- Extraction Logs or Details injected here -->
                   <div id="extraction-log" style="display:flex; flex-direction:column; gap:5px;"></div>
               </div>
           </div>
        </div>

        <!-- Tab: Automation -->
        <div id="tab-automation" class="tab-content">
           <div class="header-row"><h2>Browser Auto</h2></div>
           <select id="auto-browser"></select>
           <input type="text" id="auto-url" value="https://google.com">
           <button id="auto-btn" class="primary-btn">Launch</button>
           <div id="auto-status" style="margin-top:10px; font-size:0.8rem;"></div>
        </div>

        <!-- Tab: Settings (Chat & System) -->
        <div id="tab-settings" class="tab-content">
           <div class="header-row">
             <div style="display:flex; align-items:center; gap:10px;">
                <button id="btn-settings-back" class="nav-btn">⬅︎</button>
             </div>
           </div>
           
           <!-- Chat UI Container -->
           <div class="aside right" style="height: calc(100% - 40px); display: flex; flex-direction: column; position: relative;">
                
                <!-- Chat Interface (Always Visible for Logs) -->
                <div id="chat-interface" class="chat-interface" style="display:flex; flex-direction:column; height:100%;">
                    <!-- System Toggle (Hidden Checkbox Logic) -->
                    <input type="checkbox" id="system-toggle" checked style="display:none;">
                    
                    <div class="chat-container">
                        <label for="system-toggle" class="system-label">System Message <i class="count"></i></label>
                        
                        <div class="chat-scroll" id="chat-scroll">
                            <div id="chat-pull-top" class="chat-pull-loader">
                                <span class="spinner"></span> loading...
                            </div>
                            <div class="chat-talks"></div>
                            <div id="chat-pull-bottom" class="chat-pull-loader">
                                <span class="spinner"></span> loading...
                            </div>
                            <div class="chat-bottom"></div>
                        </div>
                        
                        <!-- Chat Input (Hidden until Authed) -->
                        <form name="chat-form" class="chat-form hidden">
                            <input type="text" name="talk" placeholder="Message..." required autocomplete="off">
                            <button type="submit" class="primary-btn" style="width:auto; padding: 0 15px;">➤</button>
                        </form>
                    </div>
                </div>
           </div>
           
           <div id="settings-tools" style="margin-top:10px; padding-top:10px; border-top:1px solid #333; display:none;">
               <div id="device-status">Checking system...</div>
               <button id="unload-btn" class="action-btn" style="background:#ef4444; border:none;">Free Memory</button>
               <button id="nav-to-auto" class="action-btn">Open Automation Tool</button>
           </div>
        </div>
        
        <!-- Hidden Trigger for Back Navigation -->
        <button id="nav-back-list" style="display:none;"></button>

      </section>
    </div>
    <div id="app"></div>
  </body>
</html>
