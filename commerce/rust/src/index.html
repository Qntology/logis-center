<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logis AI Widget</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=2" />
    <link rel="shortcut icon" href="./assets/favicon.svg?v=18" />
    <link rel="stylesheet" href="./styles.css?20" />
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="./ethers.umd.min.js"></script>
    <script src="./qrcode.min.js"></script>
    <script src="./marked.js"></script>
    <script src="./pako.js"></script>
    <script src="./blockies.js"></script>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div class="widget-wrapper">
      
      <!-- 1. The Pill Nav (Always Visible) -->
      <nav class="pill-nav">
        <div class="logo-section">
            <button id="nav-upload-btn" class="nav-btn" title="Upload Image">➕</button>
        </div>
        
        <!-- Nav Image Preview Container -->
        <div id="nav-preview-container" class="nav-preview-container hidden">
            <img id="nav-img-thumbnail" src="" />
            <button id="nav-img-clear" title="Remove image">✕</button>
        </div>

        <div id="search-container" class="search-container" style="display: flex; flex-direction: column;">            
            <input type="text" id="global-search" class="search-input" placeholder="Search or Ask" />
        </div>
        
        <div class="nav-icons" style="display: flex; align-items: center; gap: 8px;">
          <button id="btn-submit" class="nav-btn" title="AI Search">🔍</button>
          <button id="btn-extract" class="nav-btn" style="display:none; color: orange;" title="Start Extraction">⚡</button>
          <button id="btn-auto-launch" class="nav-btn" title="Open Browser">🌐</button>
          <button id="btn-settings" class="nav-btn" data-tab="settings" title="Config" style="min-width:24px; text-align:center;">🗨️</button>
        </div>
      </nav>

      <!-- 2. The Content Panel (Hidden by default) -->
      <section id="content-panel" class="content-panel">
        <!-- Tab: List (Primary View) -->
        <div id="tab-list" class="tab-content active">
           <!-- View 1: List Table -->
           <div id="list-view" style="position: relative;">
               <div class="header-row">
                 <div style="display:flex; align-items:center; gap:10px;">
                    <button id="btn-list-back" class="nav-btn" title="Collapse">⬅︎</button>
                    <h2><span id="header-loading" style="display:none; font-size:1em; font-weight:normal; margin-left:8px;">Loading...</span></h2>
                 </div>
                 <div style="display:flex; gap:5px;">
                    <button id="btn-delete-selected" class="nav-btn" style="display:none; color: #ef4444;" title="Delete Selected">🗑️ All</button>
                    <button id="list-refresh-btn" class="nav-btn" title="Refresh">🔄</button>
                 </div>
               </div>

               <div id="list-scroll-container" class="list-container" style="height: 450px; overflow: hidden; padding: 0 10px; position: relative;">
                 <div id="list-scroll" class="list-scroll">
                    <div id="list-pull-top" class="chat-pull-loader">
                        <span class="spinner"></span> sync updates...
                    </div>

                    <!-- Navigation Categories (Users + Pages Tree) -->
                    <div id="nav-categories" class="nav-categories hidden">
                        <!-- Profile Section -->
                        <div class="nav-profile"></div>

                        <div class="settings-toggle">
                            <input type="checkbox" id="settings-toggle" style="display: none;" />
                            <label for="settings-toggle">Settings</label>
                        </div>

                        <div id="settings-panel" style="display: none;">
                            <div id="device-preference-container" style="padding: 5px 10px; margin-bottom: 10px; background: rgba(255,255,255,0.05); border-radius: 6px; display: flex; align-items: center; justify-content: space-between;">
                                <label for="force-cpu-toggle" style="font-size: 0.75rem; color: #aaa; cursor: pointer;">Force CPU Mode</label>
                                <input type="checkbox" id="force-cpu-toggle" style="cursor: pointer;" />
                            </div>

                            <div id="cloud-mode-container" style="padding: 5px 10px; margin-bottom: 5px; background: rgba(255,255,255,0.05); border-radius: 6px; display: flex; align-items: center; justify-content: space-between;">
                                <label for="cloud-mode-toggle" style="font-size: 0.75rem; cursor: pointer;">Use Cloud AI</label>
                                <input type="checkbox" id="cloud-mode-toggle" style="cursor: pointer;" disabled title="Login required to use Cloud AI" />
                            </div>

                            <div style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; gap: 8px;">
                                <button id="btn-logout" class="primary-btn" style="width: 100%;">Sign Out</button>
                                <button id="btn-reset-db" class="primary-btn" style="width: 100%; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);">Initialize Local DB</button>
                            </div>

                        </div>

                        <div class="nav-tree-container">
                            <div class="nav-section">
                                <div id="search-mode-tabs" style="display: flex; gap: 10px;">
                                    <button class="mode-tab" data-mode="shipping" style="background: none; color: #666; border: none; font-size: 0.8rem; cursor: pointer;">Shipping</button>
                                    <button class="mode-tab active" data-mode="commerce" style="background: none; color: #000; border: none; font-size: 0.8rem; cursor: pointer; font-weight: bold;">Commerce</button>
                                    <button class="mode-tab" data-mode="analytic" style="background: none; color: #666; border: none; font-size: 0.8rem; cursor: pointer;">Analytic</button>
                                </div>
                            </div>

                            <div class="nav-section">
                                <h3>Shared Pages</h3>
                                <div id="nav-list-pages" class="tree-root"></div>
                            </div>
                            <div class="nav-section users">
                                <h3>
                                    Local Members

                                    <button id="btn-sync-qr" title="Sync with Mobile" style="background: none; border: none; font-size: 0.8rem; cursor: pointer; padding: 0; filter: grayscale(1);" onmouseover="this.style.filter='none'" onmouseout="this.style.filter='grayscale(1)'">ADD</button>
                                </h3>
                                <div id="nav-qr-container" class="hidden">
                                    <div id="manual-sync-view">
                                        <div>
                                            <p>
                                                <span>Seed:</span>
                                                <strong id="my-sync-seed">...</strong>
                                            </p>
                                        </div>
                                        
                                        <div>
                                            <input type="number" id="target-seed" placeholder="Enter Target Seed (e.g. 777)" style="width: 100%; padding: 8px; background: #333; border: 1px solid #444; color: white; text-align: center; border-radius: 4px; font-size: 1.1rem; letter-spacing: 2px; font-weight: bold;">
                                            <button id="btn-manual-connect" class="primary-btn">Connect</button>
                                        </div>
                                    </div>
                                </div>
                                <div id="nav-list-local-users" class="tree-root">
                                    <div style='padding-left:1em; font-size:0.75rem; color:#666;'>No local devices</div>
                                </div>
                            </div>

                            <div class="nav-section">
                                <h3>
                                    Cloud Members

                                    <button id="btn-cloud-invite-toggle" title="Invite Member" style="display: none; background: none; border: none; font-size: 0.8rem; cursor: pointer; padding: 0; filter: grayscale(1);" onmouseover="this.style.filter='none'" onmouseout="this.style.filter='grayscale(1)'">ADD</button>
                                </h3>
                                <div id="nav-cloud-invite-container" class="hidden">
                                    <div>
                                        <div>
                                            <input type="email" id="invite-email-input" placeholder="Member's E-Mail" required style="width: 100%; padding: 8px; background: #333; border: 1px solid #444; color: white; text-align: center; border-radius: 4px; font-size: 1rem; font-weight: bold;">
                                            <button id="btn-send-invite" class="primary-btn">Send Invite</button>
                                        </div>
                                    </div>
                                </div>
                                <div id="nav-list-users" class="tree-root"></div>
                            </div>
                        </div>
                    </div>

                    <div id="search-tags-container" class="search-tags-container"></div>

                    <div id="doc-list" class="card-list"></div>
                    
                    <div id="list-pull-bottom" class="chat-pull-loader">
                        <span class="spinner"></span> loading older...
                    </div>
                 </div>
               </div>
               <!-- AI Results Area -->
               <div id="ai-search-results" style="display:none; margin-top:10px; border-top:1px solid #333; padding-top:10px;">
                    <h3 id="ai-results-title" style="font-size:0.9rem; color:var(--primary);">AI Analysis Results</h3>
                    <div id="ai-results-content" style="font-size:0.8rem; line-height: 1.4;"></div>
               </div>
           </div>

           <!-- View 2: Detail Overlay -->
           <div id="detail-view" style="display:none; height:100%; flex-direction:column;">
               <div class="header-row" style="justify-content: space-between;">
                   <div style="display:flex; align-items:center; gap:10px;">
                       <button id="btn-detail-back" class="nav-btn">⬅︎</button>
                       <h2 id="detail-title">Type No</h2>
                   </div>
                   <div style="display:flex; gap:5px;">
                        <button id="btn-stop-task" class="nav-btn" style="display:none; color: #ef4444;" title="Stop Extraction">🛑</button>
                        <button id="btn-detail-delete" class="nav-btn" style="color: #ef4444;" title="Delete Document">🗑️</button>
                   </div>
               </div>
               <div id="detail-content" class="markdown-body">
                   <!-- Extraction Logs or Details injected here -->
                   <div id="extraction-log"></div>
               </div>
           </div>
        </div>

        <!-- Tab: Automation -->
        <div id="tab-automation" class="tab-content">
           <div class="header-row"><h2>Browser Auto</h2></div>
           <select id="auto-browser"></select>
           <input type="text" id="auto-url" value="https://google.com">
           <button id="auto-btn" class="primary-btn">Launch</button>
           <div id="auto-status" style="margin-top:10px; font-size:0.8rem;"></div>
        </div>

        <!-- Tab: Settings (Chat & System) -->
        <div id="tab-settings" class="tab-content">
           <div class="header-row">
             <div style="display:flex; align-items:center; gap:10px;">
                <button id="btn-settings-back" class="nav-btn">⬅︎</button>
             </div>
           </div>
           
           <!-- Chat UI Container -->
           <div class="aside right" style="height: calc(100% - 40px); display: flex; flex-direction: column; position: relative;">
                
                <!-- Chat Interface (Always Visible for Logs) -->
                <div id="chat-interface" class="chat-interface" style="display:flex; flex-direction:column; height:100%;">
                    <!-- System Toggle (Hidden Checkbox Logic) -->
                    <input type="checkbox" id="system-toggle" checked style="display:none;">
                    
                    <div class="chat-container">
                        <label for="system-toggle" class="system-label">System Message <i class="count"></i></label>
                        
                        <div class="chat-scroll" id="chat-scroll">
                            <div id="chat-pull-top" class="chat-pull-loader">
                                <span class="spinner"></span> loading...
                            </div>
                            <div class="chat-talks"></div>
                            <div id="chat-pull-bottom" class="chat-pull-loader">
                                <span class="spinner"></span> loading...
                            </div>
                            <div class="chat-bottom"></div>
                        </div>
                        
                        <!-- Chat Input (Hidden until Authed) -->
                        <form name="chat-form" class="chat-form hidden">
                            <input type="text" name="talk" placeholder="Message..." required autocomplete="off">
                            <button type="submit" class="primary-btn" style="width:auto; padding: 0 15px;">➤</button>
                        </form>
                    </div>
                </div>
           </div>
           
           <div id="settings-tools" style="margin-top:10px; padding-top:10px; border-top:1px solid #333; display:none;">
               <div id="device-status">Checking system...</div>
               <button id="unload-btn" class="action-btn" style="background:#ef4444; border:none;">Free Memory</button>
               <button id="nav-to-auto" class="action-btn">Open Automation Tool</button>
           </div>
        </div>
        
        <!-- Hidden Trigger for Back Navigation -->
        <button id="nav-back-list" style="display:none;"></button>

      </section>
    </div>
    <div id="app"></div>
  </body>
</html>
