<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logis ULTRA V109</title>
    <!-- Use direct scripts but with forced freshness -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #fb923c; --bg: #020617; }
        body { margin: 0; background: var(--bg) !important; color: white !important; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #console { position: fixed; bottom: 0; left: 0; right: 0; height: 45%; background: rgba(0,0,0,0.95); border-top: 2px solid cyan; padding: 10px; font-size: 10px; color: #4ade80; overflow-y: auto; z-index: 10000; white-space: pre-wrap; font-family: monospace; }
        .v-tag { position: fixed; top: 10px; right: 10px; background: cyan; color: black; padding: 5px; font-weight: bold; z-index: 1000; font-size: 12px; }
        .btn { background: var(--primary); border: none; color: black; padding: 15px 30px; border-radius: 10px; font-size: 1.2rem; font-weight: bold; box-shadow: 0 0 20px rgba(251, 146, 60, 0.3); }
        .hidden { display: none !important; }
        #target { background: white; padding: 20px; border-radius: 12px; display: inline-block; margin-top: 20px; border: 5px solid cyan; }
    </style>
</head>
<body>
    <div class="v-tag">V109_ULTRA_SYNC</div>
    <div id="console">--- SYSTEM TRACE V109 ---</div>

    <div style="padding: 20px; text-align: center;">
        <h2 style="color:cyan">LOGIS REMOTE V109</h2>
        
        <div id="main-ui">
            <button onclick="start()" class="btn">START SCAN 📸</button>
            <p style="margin-top: 20px; color: #64748b;">Scan Desktop QR to link</p>
        </div>

        <div id="v-area" class="hidden">
            <div style="width: 100%; height: 250px; background: #000; border: 3px solid cyan; border-radius: 15px; overflow: hidden;">
                <video id="v" playsinline style="width:100%; height:100%; object-fit:cover;"></video>
            </div>
            <canvas id="c" style="display:none;"></canvas>
            <button onclick="stop()" style="margin-top: 15px; background: #ef4444; color:white; border:none; padding:10px 20px; border-radius:20px;">CANCEL</button>
        </div>

        <div id="qr-area" class="hidden">
            <div id="target"></div>
            <h3 style="color:cyan; margin-top: 20px;">READY: SCAN WITH PC</h3>
        </div>
    </div>

    <script>
        const con = document.getElementById("console");
        function log(m, c="#4ade80") {
            const d = document.createElement("div"); d.style.color = c;
            d.style.borderBottom = "1px solid #222";
            d.textContent = `[${new Date().toLocaleTimeString()}] ${m}`;
            con.appendChild(d); con.scrollTop = con.scrollHeight;
        }

        log("V109 JS LOADED SUCCESSFULLY.");

        let stream = null;
        const video = document.getElementById("v");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        async function start() {
            try {
                log("Opening Camera...", "orange");
                document.getElementById("v-area").classList.remove("hidden");
                document.getElementById("main-ui").classList.add("hidden");
                
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                await video.play();
                log("Viewfinder active. Scanning...");
                requestAnimationFrame(tick);
            } catch (e) { log("ERR: " + e.message, "red"); }
        }

        function tick() {
            if (!stream) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                if (typeof jsQR !== "undefined") {
                    const code = jsQR(data.data, data.width, data.height);
                    if (code && code.data.includes("webrtc-pair")) {
                        log("PC FOUND! SWITCHING...", "cyan");
                        if (navigator.vibrate) navigator.vibrate(200);
                        stop(); showQR(); return;
                    }
                } else {
                    log("jsQR missing!", "red");
                }
            }
            requestAnimationFrame(tick);
        }

        function stop() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = null;
            document.getElementById("v-area").classList.add("hidden");
            document.getElementById("main-ui").classList.remove("hidden");
        }

        function showQR() {
            try {
                log("Rendering Mobile QR...");
                document.getElementById("qr-area").classList.remove("hidden");
                document.getElementById("main-ui").classList.add("hidden");
                const target = document.getElementById("target");
                target.innerHTML = "";
                
                if (typeof QRCode === "undefined") throw new Error("QRCode missing!");

                const hash = "ultra_" + Math.random().toString(36).substring(7);
                new QRCode(target, {
                    text: JSON.stringify({ type: "webrtc-pair", hash: hash, role: "mobile" }),
                    width: 250, height: 250
                });
                log("SUCCESS: QR READY", "cyan");
            } catch (e) { log("QR_ERR: " + e.message, "red"); }
        }
    </script>
</body>
</html>
