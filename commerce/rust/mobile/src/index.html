<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logis Mobile Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #fb923c; --bg: #020617; --card: #1e293b; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; height: 100vh; }
        
        /* Main Layout */
        .app-container { display: flex; flex-direction: column; height: 100%; }
        .header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        /* Content Panel (Desktop Mirror) */
        #content-panel { flex: 1; overflow-y: auto; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .card-meta { font-size: 0.8rem; color: #94a3b8; }

        /* Scanner Overlay */
        #scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-guide { position: absolute; inset: 0; border: 2px solid var(--primary); margin: 60px; border-radius: 20px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); }

        /* Status Bar */
        .status-bar { font-size: 0.7rem; padding: 5px 15px; background: #000; color: #4ade80; border-top: 1px solid #111; }
        .hidden { display: none !important; }
        .spinner { width: 20px; height: 20px; border: 2px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div style="display:flex; align-items:center; gap:10px;">
                <div id="status-icon" style="width:10px; height:10px; background:#ef4444; border-radius:50%;"></div>
                <strong style="font-size: 0.9rem;">LOGIS HUB</strong>
            </div>
            <button onclick="startScan()" style="background:none; border:none; font-size:1.5rem;">📸</button>
        </header>

        <!-- Dynamic List (Mirrors Desktop) -->
        <main id="content-panel">
            <div id="empty-state" style="text-align:center; margin-top:100px; color:#64748b;">
                <p style="font-size: 3rem; margin-bottom: 10px;">📱</p>
                <p>Not Linked to Desktop</p>
                <button onclick="startScan()" style="background:var(--primary); color:black; border:none; padding:10px 20px; border-radius:20px; font-weight:bold;">LINK NOW</button>
            </div>
            <div id="doc-list"></div>
        </main>

        <div id="status-info" class="status-bar">V112: READY</div>
    </div>

    <!-- Scanner -->
    <div id="scanner-overlay">
        <video id="v" playsinline></video>
        <canvas id="c" class="hidden"></canvas>
        <div class="scan-guide"></div>
        <button onclick="stopScan()" style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); background:#ef4444; border:none; color:white; padding:12px 30px; border-radius:25px;">CANCEL</button>
    </div>

    <!-- Answer QR View -->
    <div id="answer-qr-overlay" class="hidden" style="position:fixed; inset:0; background:white; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:black;">
        <div id="qr-target" style="padding:20px; border:1px solid #eee;"></div>
        <h3 style="margin-top:20px;">SCAN WITH DESKTOP</h3>
        <p style="font-size:0.8rem; color:#666;">Completing P2P Handshake...</p>
        <button onclick="location.reload()" style="margin-top:30px; padding:10px 20px;">BACK</button>
    </div>

    <script>
        const statusEl = document.getElementById("status-info");
        function log(m, isOk=true) {
            statusEl.textContent = `V112: ${m}`;
            statusEl.style.color = isOk ? "#4ade80" : "#ef4444";
        }

        let stream = null;
        const video = document.getElementById("v");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        async function startScan() {
            try {
                document.getElementById("scanner-overlay").style.display = "block";
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                await video.play();
                log("Scanning...");
                requestAnimationFrame(loop);
            } catch (e) { log("Camera Error: " + e.message, false); }
        }

        function loop() {
            if (!stream) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(data.data, data.width, data.height);
                if (code && code.data.includes("webrtc-pair")) {
                    log("Handshake detected!");
                    stopScan();
                    showAnswer(code.data);
                    return;
                }
            }
            requestAnimationFrame(loop);
        }

        function stopScan() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = null;
            document.getElementById("scanner-overlay").style.display = "none";
        }

        function showAnswer(data) {
            document.getElementById("answer-qr-overlay").classList.remove("hidden");
            const target = document.getElementById("qr-target");
            target.innerHTML = "";
            const session = JSON.parse(data);
            const answerData = JSON.stringify({ 
                type: "webrtc-pair", 
                hash: session.hash, 
                role: "mobile", 
                ts: Date.now() 
            });
            new QRCode(target, { text: answerData, width: 220, height: 220 });
            log("Answer QR Ready.");
        }

        // --- Mock Data Injection (Connected State) ---
        function setConnected(docList) {
            document.getElementById("empty-state").classList.add("hidden");
            document.getElementById("answer-qr-overlay").classList.add("hidden");
            document.getElementById("status-icon").style.background = "#4ade80";
            const listContainer = document.getElementById("doc-list");
            listContainer.innerHTML = docList.map(doc => `
                <div class="card">
                    <div class="card-title">${doc.title}</div>
                    <div class="card-meta">${doc.date} | ${doc.type}</div>
                </div>
            `).join("");
            log("P2P SYNC ACTIVE");
        }
    </script>
</body>
</html>
