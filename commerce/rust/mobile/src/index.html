<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logis Fresh V111</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; border: 5px solid red; box-sizing: border-box; }
        #header { padding: 20px; text-align: center; background: #111; border-bottom: 1px solid #333; }
        #viewfinder { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #console { height: 150px; background: #111; font-family: monospace; font-size: 11px; padding: 10px; overflow-y: auto; color: #0f0; border-top: 1px solid #333; }
        .btn { position: absolute; bottom: 20px; background: red; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 16px; z-index: 10; }
        .hidden { display: none !important; }
        #qr-result { position: absolute; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        #qr-img { border: 2px solid black; padding: 10px; }
    </style>
</head>
<body>
    <div id="header">
        <h2 style="margin:0; color:red;">V111 FRESH START</h2>
    </div>

    <div id="viewfinder">
        <video id="v" playsinline></video>
        <canvas id="c" class="hidden"></canvas>
        <button id="start-btn" class="btn" onclick="startCamera()">TAP TO START CAMERA</button>
        
        <div id="qr-result" class="hidden">
            <div id="qr-img"></div>
            <h3 style="color:black; margin-top:20px;">SCAN THIS WITH PC</h3>
            <button onclick="location.reload()" style="margin-top:20px; padding:10px;">RESTART</button>
        </div>
    </div>

    <div id="console">System Ready. V111_FRESH</div>

    <script>
        const logger = document.getElementById("console");
        function log(m) {
            const d = document.createElement("div");
            d.textContent = `> ${m}`;
            logger.appendChild(d);
            logger.scrollTop = logger.scrollHeight;
        }

        let stream = null;
        const video = document.getElementById("v");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        async function startCamera() {
            try {
                log("Requesting camera...");
                document.getElementById("start-btn").classList.add("hidden");
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                await video.play();
                log("Camera active. Scanning for PC QR...");
                requestAnimationFrame(loop);
            } catch (e) {
                log("ERROR: " + e.message);
                document.getElementById("start-btn").classList.remove("hidden");
            }
        }

        function loop() {
            if (!stream) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                if (typeof jsQR !== "undefined") {
                    const code = jsQR(imgData.data, imgData.width, imgData.height);
                    if (code && code.data.includes("webrtc-pair")) {
                        log("PC FOUND! Generating answer...");
                        if (navigator.vibrate) navigator.vibrate(200);
                        stopCamera();
                        showAnswerQR();
                        return;
                    }
                }
            }
            requestAnimationFrame(loop);
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = null;
        }

        function showAnswerQR() {
            try {
                document.getElementById("qr-result").classList.remove("hidden");
                const target = document.getElementById("qr-img");
                target.innerHTML = "";
                
                const hash = "fresh_" + Math.random().toString(36).substring(7);
                new QRCode(target, {
                    text: JSON.stringify({ type: "webrtc-pair", hash: hash, role: "mobile" }),
                    width: 250,
                    height: 250
                });
                log("ANSWER QR READY. SCAN WITH LAPTOP.");
            } catch (e) {
                log("QR GEN ERROR: " + e.message);
            }
        }
    </script>
</body>
</html>
