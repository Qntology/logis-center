<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logis Mobile Hub</title>
    
    <!-- External Libraries (Relative Paths) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="./pako.js"></script>
    <script src="./qrcode.min.js"></script>

    <style>
        :root { --primary: #fb923c; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }

        /* Scanner Overlay: Highest Priority */
        #scanner-overlay {
            position: fixed !important;
            inset: 0 !important;
            background: #000 !important;
            z-index: 99999 !important;
            display: none; /* Toggled via JS */
            flex-direction: column;
        }

        video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
        }

        /* Log Panel */
        #log-panel {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            height: 120px !important;
            background: rgba(0,0,0,0.8) !important;
            color: #0f0 !important;
            font-size: 10px !important;
            padding: 10px !important;
            overflow-y: auto !important;
            z-index: 100000 !important;
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .nav-btn { 
            padding: 10px 20px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
        }
    </style>

    <!-- Main Styles (Relative Path) -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app-root" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
      <nav style="padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #eee;">
        <div style="flex:1; font-weight:bold;">Logis Remote Hub</div>
        <button class="nav-btn" onclick="startCamera()">Scan Start</button>
      </nav>

      <section style="flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;">
        <div id="status-area">
            <p style="font-size:3rem;">📡</p>
            <p>Waiting for Desktop...</p>
            <p style="color: #666; font-size: 0.8rem;">(Press 'Scan Start' to connect)</p>
        </div>
      </section>
    </div>

    <!-- Scanner Overlay -->
    <div id="scanner-overlay">
        <video id="v" playsinline autoplay muted></video>
        <button onclick="stopCamera()" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); background:red; color:white; padding:15px 40px; border-radius:25px; border:none; font-weight:bold; z-index:100001; font-size: 18px;">CANCEL</button>
    </div>

    <!-- Answer QR Container -->
    <div id="answer-qr-container" style="position:fixed; inset:0; background:white; z-index:99998; display:none; flex-direction:column; align-items:center; justify-content:center;">
        <h3>Scan from Desktop</h3>
        <div id="answer-qr"></div>
        <button onclick="closeAnswerQr()" class="nav-btn" style="margin-top:20px;">Close</button>
    </div>

    <div id="log-panel">Initializing...</div>

    <!-- Main Logic (Relative Path) -->
    <script type="module" src="./src/main.ts"></script>

    <script>
        const logs = document.getElementById("log-panel");
        function debug(m) {
            console.log(m);
            if (!logs) return;
            const d = document.createElement("div");
            d.textContent = "> " + m;
            logs.appendChild(d); 
            logs.scrollTop = logs.scrollHeight;
        }

        // Global functions for buttons (attached to window since module scope is isolated)
        window.startCamera = function() {
            debug("Attempting to start camera...");
            const overlay = document.getElementById('scanner-overlay');
            if(overlay) {
                overlay.style.display = 'flex';
                debug("Overlay displayed.");
            } else {
                debug("Error: Overlay element not found!");
            }
            
            // Dispatch event for main.ts to handle
            window.dispatchEvent(new CustomEvent('request-camera-start'));
        };

        window.stopCamera = function() {
            debug("Stopping camera...");
            const overlay = document.getElementById('scanner-overlay');
            if(overlay) overlay.style.display = 'none';
            window.dispatchEvent(new CustomEvent('request-camera-stop'));
        };

        window.closeAnswerQr = function() {
            document.getElementById('answer-qr-container').style.display = 'none';
        };

        window.onload = () => {
            debug("Window Loaded");
            if (typeof pako === 'undefined') debug("Error: pako.js NOT loaded");
            else debug("pako.js loaded");
            
            if (typeof QRCode === 'undefined') debug("Error: qrcode.js NOT loaded");
            else debug("qrcode.js loaded");

            // Check if CSS is applied
            const bodyColor = window.getComputedStyle(document.body).backgroundColor;
            debug("Body BG: " + bodyColor);
        };
        
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            debug("Global Error: " + msg + " at " + lineNo);
            return false;
        };
    </script>
</body>
</html>
