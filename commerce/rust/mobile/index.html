<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logis Mobile Hub</title>
    <!-- Use relative paths -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="./pako.js"></script>
    <script src="./qrcode.min.js"></script>
    
    <style>
        :root { --primary: #fb923c; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
        #scanner-overlay { 
            position: fixed !important; 
            inset: 0 !important; 
            background: #000 !important; 
            z-index: 99999 !important; 
            display: none; 
            flex-direction: column; 
        }
        video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        #log-panel { 
            position: fixed !important; 
            bottom: 0 !important; 
            left: 0 !important; 
            right: 0 !important; 
            height: 120px !important; 
            background: rgba(0,0,0,0.8) !important; 
            color: #0f0 !important; 
            font-size: 10px !important; 
            padding: 10px !important; 
            overflow-y: auto !important; 
            z-index: 100000 !important; 
            pointer-events: none;
        }
        .nav-btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; }
    </style>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app-root" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
      <nav style="padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #eee;">
        <div style="flex:1; font-weight:bold;">Logis Remote Hub</div>
        <button class="nav-btn" onclick="startCamera()">Scan Start</button>
      </nav>
      <section style="flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;">
        <div id="status-area">
            <p style="font-size:3rem;">📡</p>
            <p>Waiting for Desktop...</p>
        </div>
      </section>
    </div>

    <div id="scanner-overlay">
        <video id="v" playsinline autoplay muted></video>
        <button onclick="stopCamera()" style="position:absolute; bottom:150px; left:50%; transform:translateX(-50%); background:red; color:white; padding:15px 40px; border-radius:25px; border:none; font-weight:bold; z-index:100001;">Cancel</button>
    </div>

    <div id="answer-qr-container" style="position:fixed; inset:0; background:white; z-index:99998; display:none; flex-direction:column; align-items:center; justify-content:center;">
        <h3>Scan from Desktop</h3>
        <div id="answer-qr"></div>
        <button onclick="closeAnswerQr()" class="nav-btn">Close</button>
    </div>

    <div id="log-panel">Initializing...</div>

    <script type="module" src="./src/main.ts"></script>

    <script>
        const logs = document.getElementById("log-panel");
        function debug(m) {
            console.log(m);
            const d = document.createElement("div");
            d.textContent = "> " + m;
            logs.appendChild(d); logs.scrollTop = logs.scrollHeight;
        }

        window.onload = () => {
            debug("Event: Window Loaded");
            if (typeof pako === 'undefined') debug("Lib: pako.js NOT found");
            else debug("Lib: pako.js Loaded");
            
            const bodyBg = window.getComputedStyle(document.body).backgroundColor;
            debug("CSS: Body BG is " + bodyBg);
        };

        let stream = null;
        const video = document.getElementById("v");

        async function startCamera() {
            debug("Camera: Requesting...");
            const overlay = document.getElementById("scanner-overlay");
            overlay.style.display = "flex";

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    debug(`Camera: Resolution ${video.videoWidth}x${video.videoHeight}`);
                    await video.play();
                    debug("Camera: Playing");
                };

                setTimeout(() => {
                    if (video.paused) {
                        debug("Camera: Retrying play...");
                        video.play().then(() => debug("Camera: Play success on retry"));
                    }
                }, 1500);

            } catch (e) { 
                debug("Camera Error: " + e.message);
                overlay.style.display = "none";
            }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById("scanner-overlay").style.display = "none";
            debug("Camera Stopped");
        }
    </script>
</body>
</html>
