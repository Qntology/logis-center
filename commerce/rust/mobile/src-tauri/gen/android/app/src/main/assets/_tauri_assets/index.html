<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logis Mobile Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="./pako.js"></script>
    <script src="./qrcode.min.js"></script>
    <style>
        #answer-qr-container { position: fixed; inset: 0; background: white; z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #answer-qr { margin: 20px 0; }
        #scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        #log-panel { height: 100px; background: #000; color: #0f0; font-size: 10px; padding: 10px; overflow-y: auto; font-family: monospace; position: fixed; bottom: 0; width: 100%; z-index: 500; opacity: 0.8; }
    </style>
  <script type="module" crossorigin src="./assets/index-DEwZnY0C.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DCYplXuM.css">
</head>
<body>
    <div class="widget-wrapper">
      <nav class="pill-nav">
        <div style="font-size: 1.2rem;">📱</div>
        <div style="flex:1; margin-left:10px; font-weight:bold;">Logis Remote Hub</div>
        <button class="nav-btn" onclick="startCamera()">📸</button>
      </nav>

      <section class="content-panel">
        <div id="tab-list" style="height:100%; display:flex; flex-direction:column;">
           <div class="header-row">
             <h2 style="margin:0; font-size:1rem; color:var(--primary);">리모트 허브</h2>
             <button class="nav-btn" style="font-size:1rem;" onclick="startCamera()">📸 스캔</button>
           </div>
           <div id="doc-list" style="flex:1; overflow-y:auto; padding:20px; text-align:center;">
                <p style="font-size:3rem; margin-top:40px;">📡</p>
                <p>데스크탑 연결 대기 중...</p>
           </div>
        </div>
      </section>
    </div>

    <div id="answer-qr-container">
        <h3>데스크탑에서 이 QR을 스캔하세요</h3>
        <div id="answer-qr"></div>
        <p id="qr-status">ICE 정보 수집 중...</p>
        <button onclick="closeAnswerQr()" style="padding:15px 40px; border-radius:25px; background:#fb923c; color:white; border:none; font-weight:bold;">닫기</button>
    </div>

    <div id="scanner-overlay">
        <video id="v" playsinline></video>
        <canvas id="c"></canvas>
        <button onclick="stopCamera()" style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); background:red; color:white; padding:15px 40px; border-radius:25px; border:none; font-weight:bold;">취소</button>
    </div>

    <div id="log-panel">Initializing Hub...</div>

    <!-- Vite 엔트리 포인트 추가 -->

    <script>
        const logs = document.getElementById("log-panel");
        function debug(m) {
            console.log(m);
            const d = document.createElement("div");
            d.textContent = "> " + m;
            logs.appendChild(d); logs.scrollTop = logs.scrollHeight;
        }

        let peerConn = null;
        let stream = null;
        const video = document.getElementById("v");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        function compress(data) {
            const s = JSON.stringify(data);
            const compressed = pako.deflate(s);
            return btoa(String.fromCharCode.apply(null, compressed));
        }

        function decompress(b64) {
            const str = atob(b64);
            const charData = str.split('').map(x => x.charCodeAt(0));
            const binData = new Uint8Array(charData);
            const data = pako.inflate(binData, { to: 'string' });
            return JSON.parse(data);
        }

        async function initWebRTC(offerData) {
            debug("WebRTC 초기화 (STUN 미사용)...");
            peerConn = new RTCPeerConnection({
                iceServers: [] // STUN/TURN 없이 로컬 네트워크만 사용
            });

            const dc = peerConn.createDataChannel("logis-sync");
            setupDataChannel(dc);

            peerConn.ondatachannel = (e) => setupDataChannel(e.channel);

            await peerConn.setRemoteDescription(new RTCSessionDescription(offerData.sdp));
            const answer = await peerConn.createAnswer();
            await peerConn.setLocalDescription(answer);

            debug("ICE Candidate 수집 대기 중...");
            peerConn.onicegatheringstatechange = () => {
                if (peerConn.iceGatheringState === "complete") {
                    showAnswerQr();
                }
            };
        }

        function showAnswerQr() {
            const container = document.getElementById("answer-qr-container");
            const qrTarget = document.getElementById("answer-qr");
            container.style.display = "flex";
            qrTarget.innerHTML = "";

            const answerData = {
                type: "webrtc-answer",
                sdp: peerConn.localDescription,
                ts: Date.now()
            };

            const compressed = compress(answerData);
            new QRCode(qrTarget, {
                text: "logis-ans:" + compressed,
                width: 250, height: 250,
                correctLevel: QRCode.CorrectLevel.L
            });
            document.getElementById("qr-status").textContent = "준비 완료! 데스크탑으로 스캔하세요.";
        }

        function closeAnswerQr() {
            document.getElementById("answer-qr-container").style.display = "none";
        }

        function setupDataChannel(channel) {
            channel.onopen = () => {
                debug("✅ P2P 연결 성공!");
                closeAnswerQr();
                document.getElementById("doc-list").innerHTML = "<h3>데스크탑과 연결됨</h3>";
            };
            channel.onmessage = (e) => debug("수신: " + e.data);
        }

        async function startCamera() {
            debug("카메라 요청...");
            try {
                document.getElementById("scanner-overlay").style.display = "block";
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                await video.play();
                requestAnimationFrame(scanLoop);
            } catch (e) { debug("카메라 에러: " + e.message); }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = null;
            document.getElementById("scanner-overlay").style.display = "none";
        }

        function scanLoop() {
            if (!stream) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code && code.data.startsWith("logis-off:")) {
                    debug("데스크탑 QR 인식 성공!");
                    stopCamera();
                    try {
                        const offerData = decompress(code.data.replace("logis-off:", ""));
                        initWebRTC(offerData);
                    } catch (e) { debug("복호화 에러: " + e.message); }
                    return;
                }
            }
            requestAnimationFrame(scanLoop);
        }
    </script>
</body>
</html>
