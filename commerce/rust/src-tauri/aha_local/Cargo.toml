[package]
name = "aha"
version = "0.1.6"
edition = "2024"
repository = "https://github.com/jhqxxx/aha"
license = "Apache-2.0"
description = "aha model inference library"

[dependencies]
candle-core = { version = "0.9.1"}
candle-nn = { version = "0.9.1"}
candle-transformers = { version = "0.9.1"}
candle-flash-attn = { version = "0.9.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
image = "0.25.8"
base64 = "0.22.1"
num = "0.4.3"
minijinja = "2.12.0"
tokenizers = "0.22.1"
uuid = { version = "1.18.1", features = ["v4"]}
chrono = "0.4.42"
tokio = "1.47.1"
rayon = "1.10"
dirs = "6.0.0" # Needed for cache paths
url = "2.5.7"

[features]
flash-attn=["candle-flash-attn"]
cuda=["candle-nn/cuda", "candle-core/cuda", "candle-transformers/cuda"]

[lints.clippy]
needless_range_loop = "allow"
single_range_in_vec_init = "allow"