[package]
name = "rust"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "test_qwen"
path = "src/bin/test_qwen.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# core dependencies
candle-core = { git = "https://github.com/guoqingbao/candle.git", version = "0.8.3", rev = "5bed038" }
candle-nn = { git = "https://github.com/guoqingbao/candle.git", version = "0.8.3", rev = "5bed038" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0.58"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# inference & model dependencies
tokenizers = { version = "0.21.2", features = ["http"] }
hf-hub = "0.4.1"
itertools = "0.13.0"
akin = "0.4.0"
indicatif = "0.17.11"
llguidance = "0.6"
toktrie = "1.4"
half = { version = "2.7.1", features = ["num-traits", "use-intrinsics", "rand_distr"] }
either = { version = "1.13.0", features = ["serde"] }
minijinja = { version = "2.10.2", features = ["builtins", "json"] }
minijinja-contrib = { version = "2.10.2", features = ["pycompat"] }
lazy_static = "1.4.0"
interprocess = "2.2.2"
serde-big-array = "0.5.1"
bincode = "1.3.1"
twox-hash = "2.1.1"
rand = "0.9.0"
rayon = "1.10"
ahash = "0.8.11"
parking_lot = "0.12"
attention_rs = { package = "attention-rs", path = "src/models/attention", features = ["cuda"] }
once_cell = "1.18"
tqdm = "0.8.0"
futures = "0.3"
base64 = "0.22"
uuid = { version = "1.4", features = ["v4"] }
colored = "3.0.0"
sysinfo = "0.30"
image = { version = "0.25", features = ["jpeg", "png"] }
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"], default-features = false }
bytemuck = "1.25.0"
regex = "1"
url = "2.5.7"
tool-parser = "1.1.1"
openai-protocol = "1.2.0"
encoding_rs = "0.8"
flate2 = "1.0"
flume = "0.11"
clap = { version = "4.4", features = ["derive"] }

# tauri & UI specific
tauri = { version = "2.9.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
chrono = { version = "0.4", features = ["serde"] }
num = "0.4.3"
dirs = "6.0.0"
fantoccini = "0.19"
chromiumoxide = { version = "0.8.0", features = ["tokio-runtime"] }
which = "6.0"
scraper = "0.25.0"
lancedb = { version = "0.23.1", default-features = false }
safetensors = "0.4"
ethers-core = "2.0"
ethers-signers = "2.0"
arrow-array = "56.2.0"
arrow-schema = "56.2.0"
ego-tree = "0.10"
nvml-wrapper = "0.9.0"
memmap2 = "0.9"
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_System_Memory"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
direct-storage = { path = "./direct-storage" }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Direct3D12", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "attention_rs/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "attention_rs/metal"]
flash-attn = []

[profile.dev]
opt-level = 0
incremental = true

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 16
