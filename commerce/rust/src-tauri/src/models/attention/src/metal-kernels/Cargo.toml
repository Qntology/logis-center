[package]
name = "metal-kernels"
version = "0.1.9"
edition = "2021"
description = "Paged attention kernels for Metal device"
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]
metal = { version = "0.29.0", features = ["mps"] }
thiserror = "1"
once_cell = "1.20.2"
candle-core = "0.9.1"

[build-dependencies]
anyhow = { version = "1", features = ["backtrace"] }

