[package]
name = "logis-llm"
description = "logis-center 모델 엔진: Qwen(2.5-VL · 3 · 3.5 · 3-VL · 4-Exp) · granite 생성 루프, granite 임베딩(97m, 배치 · 텍스트 캐시 · 눈금 보정), KV 배치(VRAM · RAM · SSD) · 암호화 KV 블록, 어휘 잘라 내기, GGUF 변환(Q4_K_M), 토크나이저 · 채팅 템플릿 · 위치 임베딩, 장치 · 메모리 도우미. Tauri · DB 없음"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# 앱(apps/desktop)의 같은 이름 기능이 이 기능도 켭니다. 옮긴 코드의 #[cfg(feature = …)] 는 이 crate 의 기능을 봅니다.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "candle-flash-attn?/cuda"]
rocm = ["dep:candle-rocm", "candle-core/rocm", "candle-nn/rocm", "candle-flash-attn?/rocm"]
vulkan = ["candle-core/vulkan", "candle-nn/vulkan", "candle-flash-attn?/vulkan"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# Fused FlashAttention (v1/v2/v3 tiers, picked per GPU) from the candle-rocm-vulkan fork (models/common · models/qwen/common).
flash-attn = ["dep:candle-flash-attn", "candle-flash-attn/flash-attn", "candle-core/flash-attn", "candle-nn/flash-attn"]
# TurboQuant / NVFP4 / MXFP4 / MXFP8 / FP8 quantization kernels (candle_nn::turbo_quant).
turbo-quant = ["candle-core/turbo-quant", "candle-nn/turbo-quant"]

[dependencies]
ahash = "0.8.11"
anyhow.workspace = true
base64 = "0.22"
# candle 은 crates.io 이름으로 적고, 루트 Cargo.toml 의 [patch.crates-io] 가 포크 커밋으로 바꿉니다 (앱과 하나로 합쳐짐).
candle-core = "0.11.0"
candle-flash-attn = { version = "0.11.0", optional = true, default-features = false }
candle-nn = "0.11.0"
candle-rocm = { workspace = true, optional = true }
candle-transformers = "0.11.0"
chrono = { version = "0.4", features = ["serde"] }
half = "2.4"
image = { version = "0.25", features = ["jpeg", "png"] }
libc = "0.2"
logis-bias.workspace = true
logis-schema.workspace = true
logis-sds.workspace = true
memmap2 = "0.9"
# utils::device_utils::release_heap 이 부르는 mi_collect (전역 할당기는 앱 main.rs)
mimalloc = { version = "0.1.48", features = ["v3"] }
minijinja = "2.12.0"
nvml-wrapper = "0.9.0"
once_cell.workspace = true
# granite 임베딩의 ModernBERT 인코더(예전 ForwardMode::Exact 순전파, 연산 그대로)는 premium-discount-nlp 에 있습니다 (models/embedding.rs).
premium-discount-cpu-kernels.workspace = true
premium-discount-manifest.workspace = true
premium-discount-nlp = { workspace = true, features = ["granite"] }
premium-discount-quant = { workspace = true, features = ["mine"] }
rand = "0.8"
rayon = "1.10"
safetensors = "0.4"
serde.workspace = true
serde_json.workspace = true
smallvec = "1"
sysinfo = "0.30"
tokenizers = "0.22.2"
tokio = { version = "1", features = ["full"] }
url = "2.5.7"
# Win32_Foundation: HANDLE · BOOL 을 쓰는 함수(GetCurrentProcess · SetProcessWorkingSetSizeEx · VirtualUnlock …)에 필요. 앱 빌드에서는
# 다른 crate 가 켜 주어 드러나지 않았고, 이 crate 만 빌드(-p logis-llm)하면 빠집니다.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
# models/embedding.rs 의 임베딩 공간 시험이 코사인 도우미를 씀
logis-pug.workspace = true

[target.'cfg(windows)'.dependencies]
direct-storage = { path = "../../vendor/direct-storage" }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.13"
