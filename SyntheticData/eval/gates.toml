# Machine-readable regression & AlphaEdge superiority gates (Phase 5 – Part 1)
schema_version = 1

[equivalence]
e0_max_abs_err = 0.0
e1_min_top1_match_pct = 99.5
e1_max_kld = 0.005
e2_min_cosine = 0.995
e3_max_cer = 0.01

[vocab_integrity]
max_orphan_bpe_tokens = 0
min_core12_lang_coverage = 12
min_ascii_identifier_exact_pct = 100.0

[alphaedge_superiority]
# Strict criterion: our model/runtime MUST beat matched alphaedge on ALL THREE axes:
#   1) VRAM usage strictly lower
#   2) Speed strictly faster (both ms/tok AND total generation time)
#   3) Precision strictly higher (12-lang accuracy, identifier exactness, 0 orphan tokens)
require_lower_vram = true
require_faster_ms_per_tok = true
require_faster_total_gen_ms = true
require_higher_precision = true

[runtime_gates]
min_decode_resident_ratio = 0.95
max_rescue_rate_clustered = 0.08
min_full_bias_non_empty_pct = 100.0

[search_gates]
min_commerce_mrr = 0.70
min_shipping_mrr = 0.65
max_sparse_latency_ms = 25.0
