# Linux / Windows verification of the same code the Mac run covers (docs/mac-verify.md).
#
# GitHub-hosted runners have no GPU. So only what can really run is run:
#   mac (macos-15, M1 virtual): cpu / metal / vulkan(MoltenVK) — the real GPU path of the Mac verification
#   cpu            : build + the non-ignored suite (+ the embed-cpu-kernels contract tests)
#   vulkan (Linux) : lavapipe (software Vulkan, a CPU device): suite + the device tests of the vision batch path
#   vulkan (Win)   : build only (no software Vulkan ICD is installed) — reported as "build only"
#   cuda / rocm    : type check only (`cargo check`); never executed, never reported as a pass of a run.
#                    cuda jobs also sweep the GPU architectures (.github/scripts/cuda-arch-sweep.py): one per kernel
#                    branch, derived from the kernel sources and from what the installed toolkit supports
# Real CUDA / ROCm / Windows-GPU execution needs a self-hosted runner with that GPU (not covered here).
name: cross-verify

on:
  # Every push to any branch runs all targets. A workflow file that is not on the
  # default branch cannot be dispatched, so the working branch is triggered by push as well.
  # `[skip ci]` in the head commit message skips it. `[targets: windows-cpu,windows-cuda]` in the head commit
  # message runs only those jobs (no duplicate runs of what did not change); workflow_dispatch takes the same list.
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      targets:
        description: "comma list of: mac-cpu, mac-metal, mac-vulkan, linux-cpu, linux-vulkan, linux-cuda, linux-rocm, windows-cpu, windows-vulkan, windows-cuda, windows-cuda12, windows-rocm (all = every one)"
        default: "all"

concurrency:
  group: cross-verify-${{ github.ref }}
  cancel-in-progress: false

env:
  # One toolchain for every OS and every run (a floating `stable` gave Mac / Linux / Windows different compilers
  # within the same hours). Raise it here, in one place, and the cache keys follow.
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"
  GRANITE_REPO: ibm-granite/granite-embedding-97m-multilingual-r2

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          TARGETS: ${{ inputs.targets || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # stdout of the script = the matrix (GITHUB_OUTPUT); stderr = a human line, shown as an annotation either way
          python3 - > "$RUNNER_TEMP/plan.out" 2> "$RUNNER_TEMP/plan.err" <<'PY' || { echo "::error title=plan::$(cat "$RUNNER_TEMP/plan.err")"; exit 1; }
          import json, os, re, sys
          t = os.environ.get("TARGETS", "").strip()
          if not t:
              # Only a line that holds nothing but the token counts (prose that mentions `[targets: ...]` must not
              # select anything); with several such lines the last one wins.
              found = re.findall(r"(?m)^[ \t]*\[targets:[ \t]*([^\]\n]+)\][ \t]*$", os.environ.get("COMMIT_MSG", ""))
              t = found[-1] if found else "all"
          t = t.replace(" ", "")
          want = None if t == "all" else set(t.split(","))
          inc = [
            dict(name="mac-cpu", os="macos-15", kind="run", features=""),
            dict(name="mac-metal", os="macos-15", kind="run", features="metal"),
            dict(name="mac-vulkan", os="macos-15", kind="run", features="vulkan"),
            dict(name="linux-cpu", os="ubuntu-latest", kind="run", features=""),
            dict(name="linux-vulkan", os="ubuntu-latest", kind="run", features="vulkan"),
            dict(name="linux-cuda", os="ubuntu-latest", kind="cuda-check", features="cuda,flash-attn,turbo-quant"),
            dict(name="linux-rocm", os="ubuntu-latest", kind="check", features="rocm,flash-attn,turbo-quant"),
            dict(name="windows-cpu", os="windows-latest", kind="run", features=""),
            dict(name="windows-vulkan", os="windows-latest", kind="build", features="vulkan"),
            # CUDA 13 + VS 2026 (MSVC 14.51): the combination commerce/build_cargo.bat builds with.
            # sm_80, not sm_75: candle-kernels 0.11.0 compatibility.cuh defines __hmax_nan / __hmin_nan for
            # __CUDA_ARCH__ < 800, and the CUDA 13.2 headers already define them -> "already been defined" (sm_75 run).
            dict(name="windows-cuda", os="windows-latest", kind="cuda-check", features="cuda,flash-attn,turbo-quant", cuda="13.2.0", cuda_cap="80"),
            # CUDA 12 (Pascal / Volta can only be built for by a 12.x toolkit) needs a VS 2022 toolset
            dict(name="windows-cuda12", os="windows-2022", kind="cuda-check", features="cuda,flash-attn,turbo-quant", cuda="12.6.2", cuda_cap="80"),
            dict(name="windows-rocm", os="windows-latest", kind="check", features="rocm,flash-attn,turbo-quant"),
          ]
          unknown = (want or set()) - {i["name"] for i in inc}
          if unknown:
              print("unknown targets: " + ",".join(sorted(unknown)) + "  (valid: " + ",".join(i["name"] for i in inc) + ")", file=sys.stderr)
              sys.exit(1)
          inc = [i for i in inc if want is None or i["name"] in want]
          print("targets: " + ",".join(i["name"] for i in inc), file=sys.stderr)
          print("matrix=" + json.dumps({"include": inc}))
          PY
          cat "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"
          echo "::notice title=targets::$(cat "$RUNNER_TEMP/plan.err")"

  cross:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      # rocm: hipcc is not installed on the runner; the build script writes empty kernel images.
      CANDLE_ROCM_SKIP_KERNEL_BUILD: "1"
      # cuda: no GPU to detect the compute capability from, so it is set per job (default sm_80, Ampere).
      CUDA_COMPUTE_CAP: ${{ matrix.cuda_cap || '80' }}
    steps:
      - uses: actions/checkout@v4
        with: { path: logis-center }
      - uses: actions/checkout@v4
        with: { repository: sungu-che/candle-rocm-vulkan, ref: master, path: candle-rocm-vulkan, fetch-depth: 0 }
      - name: environment report (runner, before setup)
        run: logis-center/.github/scripts/env-report.sh before-setup
      - name: apply fork patch series + path dependencies (job only)
        run: |
          logis-center/.github/scripts/apply-fork-patches.sh
          logis-center/.github/scripts/use-fork-path.sh logis-center/commerce/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # Restore here, save at the very end (`if: always()`): the combined actions/cache only saves when the job
      # succeeds, so a job that kept failing (windows-cpu / windows-cuda) rebuilt everything from scratch every run.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logis-center/commerce/src-tauri/target
          key: cross-cpuv2-${{ matrix.name }}-${{ matrix.os }}-rust${{ env.RUST_VERSION }}${{ matrix.kind == 'cuda-check' && format('-cuda{0}-sm{1}', matrix.cuda || 'apt', matrix.cuda_cap || '80') || '' }}-${{ hashFiles('logis-center/commerce/src-tauri/Cargo.lock', 'logis-center/patches/candle-rocm-vulkan/*.patch') }}
          restore-keys: cross-cpuv2-${{ matrix.name }}-${{ matrix.os }}-rust${{ env.RUST_VERSION }}${{ matrix.kind == 'cuda-check' && format('-cuda{0}-sm{1}', matrix.cuda || 'apt', matrix.cuda_cap || '80') || '' }}-
      - name: error-annotation helper
        run: |
          cat > "$RUNNER_TEMP/annot.sh" <<'SH'
          # annot LOGFILE : the first compiler / build-script / test errors + the last log lines, as one annotation
          annot() {
            local f="$1" msg
            msg="$( { grep -oE '\((exit (code|status)|signal)[^)]*\)' "$f" | head -3 | sed 's/^/rustc ended with /'; grep -E '^(error|warning: build failed)|panicked at|failed to run custom build|--- stderr|--- stdout|nvcc|fatal|^failures:|FAILED|exit code|STATUS_|not found' -A3 "$f" | cut -c1-300 | head -30; echo '--- last lines ---'; tail -25 "$f" | cut -c1-300; } | tr '\r' ' ' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3800 )"
            echo "::error title=log::$msg"
          }
          # notice_lines TITLE LOGFILE REGEX : matching lines as one notice (proof of what really ran)
          notice_lines() {
            local msg
            msg="$(grep -E "$3" "$2" | cut -c1-400 | head -8 | tr '\r' ' ' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::notice title=$1::${msg:-<no matching lines>}"
          }
          # dll_report EXE : Windows — name the DLLs the test binary imports that are not on PATH (STATUS_DLL_NOT_FOUND does not say which)
          dll_report() {
            local exe="$1" tool dlls d missing=""
            tool="$(command -v llvm-objdump || command -v objdump || true)"
            if [ -z "$tool" ] || [ ! -f "$exe" ]; then echo "::warning title=dll report::no objdump or no test binary ($exe)"; return 0; fi
            dlls="$("$tool" -p "$exe" 2>/dev/null | grep -i 'DLL Name:' | sed 's/.*DLL Name: *//I' | tr -d '\r' | sort -u)"
            for d in $dlls; do
              case "$d" in api-ms-win-*|ext-ms-win-*) continue ;; esac
              where.exe "$d" >/dev/null 2>&1 || missing="$missing $d"
            done
            echo "::notice title=dll report::$(echo $dlls | wc -w) imported DLLs; NOT found on PATH:${missing:- none}"
          }
          # ort_path : Windows only — the ONNX Runtime DLL is linked dynamically and must be on PATH to start a test binary
          ort_path() {
            [ "$RUNNER_OS" = Windows ] || return 0
            local dll d
            dll="$(find target -name onnxruntime.dll 2>/dev/null | head -1)"
            if [ -n "$dll" ]; then
              d="$(cd "$(dirname "$dll")" && pwd)"; export PATH="$d:$PATH"
              echo "::notice title=onnxruntime dll::$d : $(ls "$d" | grep -i '\.dll$' | tr '\n' ' ')"
            else
              echo "::warning title=onnxruntime dll::onnxruntime.dll not found under target"
            fi
          }
          SH
      - name: Tauri system libraries (Linux; macOS / Windows need none)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev
      - name: tauri build inputs (same as .github/scripts/app-tests.sh)
        working-directory: logis-center/commerce
        run: |
          # tauri::generate_context! needs ../dist; bundle.resources "dlls/*" needs one file.
          [ -f dist/index.html ] || { mkdir -p dist; echo '<html></html>' > dist/index.html; }
          mkdir -p src-tauri/dlls; [ -n "$(ls -A src-tauri/dlls)" ] || touch src-tauri/dlls/.gitkeep
      - name: protoc (lancedb / lance-encoding build script)
        run: |
          case "$RUNNER_OS" in
            Windows)
              choco install protoc -y --no-progress
              p="$(find /c/ProgramData/chocolatey -iname protoc.exe 2>/dev/null | head -1)"
              [ -n "$p" ] || { echo "::error title=protoc::protoc.exe not found after choco install"; exit 1; }
              echo "PROTOC=$(cygpath -w "$p")" >> "$GITHUB_ENV"   # do not rely on PATH being refreshed between steps
              "$p" --version ;;
            macOS)   brew install protobuf >/dev/null 2>&1 || brew install protobuf ;;
            *)       sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler ;;
          esac
      - name: DirectStorage runtime DLLs (Windows, same NuGet package as commerce/run_cargo.bat)
        if: runner.os == 'Windows' && matrix.kind == 'run'
        run: |
          v=1.3.0
          d="$RUNNER_TEMP/dstorage"; mkdir -p "$d"
          curl -fsSL --retry 3 -o "$d/pkg.nupkg" "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.DirectStorage/$v"
          unzip -q -o "$d/pkg.nupkg" -d "$d/pkg"
          bin="$d/pkg/native/bin/x64"
          ls -la "$bin" || { echo "::error title=DirectStorage::native/bin/x64 is not in the package"; find "$d/pkg" -maxdepth 3 | head -30; exit 1; }
          echo "$(cygpath -w "$bin")" >> "$GITHUB_PATH"
          echo "::notice title=DirectStorage DLLs::$v : $(ls "$bin" | tr '\n' ' ')"
      - name: macOS — target CPU (the virtual M1 runner cannot name its CPU; same as mac-verify.yml)
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=-C target-cpu=apple-m1" >> "$GITHUB_ENV"

      # commerce/src-tauri/.cargo/config.toml builds with -C target-cpu=native. A cached target dir (proc-macro DLLs included)
      # built on one runner CPU is loaded by rustc on another runner: windows-cuda died with STATUS_ILLEGAL_INSTRUCTION
      # (0xc000001d) in `rustc boa_string`. The runner pool mixes CPU models, so x86 jobs build for a baseline every one has.
      - name: x86 — portable CPU target (a cache built on another runner CPU must stay loadable)
        if: runner.os != 'macOS'
        shell: bash
        run: echo "RUSTFLAGS=-C target-cpu=x86-64-v2" >> "$GITHUB_ENV"
      - name: macOS — MoltenVK
        if: matrix.name == 'mac-vulkan'
        run: |
          brew install molten-vk vulkan-loader vulkan-tools >/dev/null 2>&1 || brew install molten-vk vulkan-loader vulkan-tools
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib:$(brew --prefix molten-vk)/lib" >> "$GITHUB_ENV"
      - name: software Vulkan (lavapipe)
        if: matrix.name == 'linux-vulkan'
        run: |
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          echo "CANDLE_VULKAN_ALLOW_CPU=1" >> "$GITHUB_ENV"
      - name: CUDA toolkit (apt nvcc for the kernel build; no GPU)
        if: matrix.name == 'linux-cuda'
        run: sudo apt-get install -y -qq nvidia-cuda-toolkit
      - name: CUDA toolkit 13 (Windows; all components, names differ from 12)
        if: matrix.kind == 'cuda-check' && runner.os == 'Windows' && startsWith(matrix.cuda, '13.')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
      - name: CUDA toolkit 12 (Windows; nvcc, headers, libs — no GPU)
        if: matrix.kind == 'cuda-check' && runner.os == 'Windows' && startsWith(matrix.cuda, '12.')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
      - name: nvcc flags for CUDA 13 (CCCL needs the standard preprocessor; same as commerce/build_cargo.bat)
        if: startsWith(matrix.cuda, '13.')
        run: echo "NVCC_PREPEND_FLAGS=-Xcompiler /Zc:preprocessor" >> "$GITHUB_ENV"
      - name: MSVC developer environment (nvcc needs cl.exe in PATH)
        if: matrix.kind == 'cuda-check' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Git for Windows link.exe shadows MSVC link.exe once the MSVC env is on PATH — move it away
        if: matrix.kind == 'cuda-check' && runner.os == 'Windows'
        run: |
          if [ -f /usr/bin/link.exe ]; then mv /usr/bin/link.exe /usr/bin/link_git.exe; echo "moved Git link.exe"; fi
          where.exe link
      - name: NVCC_CCBIN = the cl.exe on PATH (cudaforge then passes -ccbin and -allow-unsupported-compiler)
        if: matrix.kind == 'cuda-check' && runner.os == 'Windows'
        run: |
          cl_path="$(where.exe cl | head -1 | tr -d '\r')"
          echo "cl.exe: $cl_path"
          echo "NVCC_CCBIN=$cl_path" >> "$GITHUB_ENV"
      - name: nvcc direct diagnostic (surfaces nvcc's own message; same flags as candle-kernels)
        if: matrix.kind == 'cuda-check'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          printf '__global__ void k(float* x){ x[0] = 1.0f; }\n' > t.cu
          set +e
          extra=(); [ -n "${NVCC_CCBIN:-}" ] && extra=(-allow-unsupported-compiler -ccbin "$NVCC_CCBIN")
          nvcc -gencode arch=compute_${CUDA_COMPUTE_CAP:-80},code=sm_${CUDA_COMPUTE_CAP:-80} --expt-relaxed-constexpr -std=c++17 -O3 "${extra[@]}" -c t.cu -o t.obj > nvcc.log 2>&1; rc=$?
          cat nvcc.log
          msg="rc=$rc ccbin=${NVCC_CCBIN:-<none>}: $(head -c 1500 nvcc.log | tr '\r\n' '  ' | sed 's/%/%25/g')"
          if [ "$rc" = 0 ]; then echo "::notice title=nvcc diagnostic::$msg"; else echo "::error title=nvcc diagnostic::$msg"; exit 1; fi
      - uses: actions/setup-python@v5
        if: matrix.kind == 'run'
        with: { python-version: "3.12" }
      - name: mock granite model (seeded, identical on every platform)
        if: matrix.kind == 'run'
        run: |
          python -m pip install -q numpy
          python -I logis-center/commerce/src-tauri/tests/fixtures/granite_mock/gen_granite_mock.py "$RUNNER_TEMP/mock-models"

      - name: environment report (after setup, before build)
        run: logis-center/.github/scripts/env-report.sh before-build

      # ── run: build + suite ──
      - name: build (cargo test --no-run)
        if: matrix.kind == 'run' || matrix.kind == 'build'
        working-directory: logis-center/commerce/src-tauri
        run: |
          . "$RUNNER_TEMP/annot.sh"; set +e
          f="${{ matrix.features }}"
          cargo test --test it --no-default-features ${f:+--features $f} --no-run 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -3
          rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { annot "$RUNNER_TEMP/build.log"; exit 1; }
      - name: suite (it, non-ignored)
        if: matrix.kind == 'run'
        working-directory: logis-center/commerce/src-tauri
        run: |
          . "$RUNNER_TEMP/annot.sh"; set +e; ort_path
          f="${{ matrix.features }}"
          cargo test --test it --no-default-features ${f:+--features $f} -- --test-threads 2 2>&1 | tee "$RUNNER_TEMP/suite.log" | tail -5
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            echo "suite exit code: $rc"; annot "$RUNNER_TEMP/suite.log"
            if grep -qE 'STATUS_DLL_NOT_FOUND|0xc0000135' "$RUNNER_TEMP/suite.log"; then dll_report "$(ls -t target/debug/deps/it-*.exe 2>/dev/null | head -1)"; fi
            exit 1
          fi
          notice_lines "suite result" "$RUNNER_TEMP/suite.log" '^test result'
      - name: "vision batch (ignored device tests — phrase encoding invariance on the device)"
        if: contains(fromJSON('["linux-vulkan","mac-metal","mac-vulkan"]'), matrix.name)
        working-directory: logis-center/commerce/src-tauri
        run: |
          . "$RUNNER_TEMP/annot.sh"; set +e; ort_path
          f="${{ matrix.features }}"
          cargo test --test it --no-default-features ${f:+--features $f} -- vision_batch --ignored --nocapture --test-threads 1 2>&1 | tee "$RUNNER_TEMP/vision.log" | tail -5
          rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { annot "$RUNNER_TEMP/vision.log"; exit 1; }
          if grep -q 'VISION-BATCH\] 구 인코딩' "$RUNNER_TEMP/vision.log"; then
            notice_lines "vision batch (device test ran)" "$RUNNER_TEMP/vision.log" 'VISION-BATCH'
          else
            echo "::error title=vision batch::NOT RUN — the device test skipped itself (no device found); this is not a pass"; exit 1
          fi
      - name: embed-cpu-kernels contract tests
        if: matrix.kind == 'run' && matrix.features == ''
        working-directory: logis-center/commerce
        run: cargo test --release --manifest-path crates/embed-cpu-kernels/Cargo.toml
      - name: "embed mock (CPU, default policy — bit identity + speed)"
        if: matrix.name == 'linux-cpu' || matrix.name == 'windows-cpu'
        working-directory: logis-center/commerce/src-tauri
        env:
          LOGIS_TEST_EMBED_DEVICE: cpu
          LOGIS_TEST_MODELS: "1"
          LOGIS_REQUIRE_MODELS: "1"
        run: |
          . "$RUNNER_TEMP/annot.sh"; ort_path
          LOGIS_MODELS_DIR="$RUNNER_TEMP/mock-models" cargo test --test it --no-default-features -- app_embed::gpu_embed_many_matches_per_text_and_is_faster --ignored --nocapture --test-threads 1

      # ── check: type check only ──
      - name: type check (cargo check — not executed)
        id: typecheck
        if: matrix.kind == 'check' || matrix.kind == 'cuda-check'
        working-directory: logis-center/commerce/src-tauri
        run: |
          . "$RUNNER_TEMP/annot.sh"; set +e
          cargo check --no-default-features --features "${{ matrix.features }}" --lib --bins --test it 2>&1 | tee "$RUNNER_TEMP/check.log" | tail -3
          rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { annot "$RUNNER_TEMP/check.log"; exit 1; }

      # ── scope: say plainly what this job covered (a skipped stage is not a pass) ──
      - name: CUDA architecture sweep (one architecture per kernel branch, derived from the sources and the toolkit)
        if: always() && matrix.kind == 'cuda-check'
        working-directory: logis-center/commerce/src-tauri
        env:
          # the architecture the type-check step compiled is not compiled twice (only when that step passed)
          SWEEP_SKIP: ${{ steps.typecheck.outcome == 'success' && (matrix.cuda_cap || '80') || '' }}
          SWEEP_MINUTES: ${{ runner.os == 'Windows' && '75' || '60' }}
          # lowest GPU generation the project builds for (Ampere, sm_80 = what the type check compiles). Below it a failure is a warning:
          # crates.io candle-kernels 0.11.0 does not compile below sm_80 on CUDA 13 (__hmax_nan redefinition) nor below sm_70 on CUDA 12.
          SWEEP_MIN_SM: "80"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" ../../.github/scripts/cuda-arch-sweep.py

      - name: save build cache (also after a failed job; only when this exact key is not stored yet)
        if: always() && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logis-center/commerce/src-tauri/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: scope of this job
        if: always()
        run: |
          case "${{ matrix.kind }}" in
            run)        msg="build + non-ignored suite; device tests only where listed. NOT RUN here: real CUDA / ROCm / Windows-GPU execution" ;;
            build)      msg="build only. NOT RUN: tests (no software Vulkan driver on this runner)" ;;
            check)      msg="type check only (cargo check). NOT RUN: build of test binaries, any test (no GPU / SDK to link or run)" ;;
            cuda-check) msg="type check with a real nvcc kernel build (CUDA ${{ matrix.cuda || 'apt' }}, sm_${{ matrix.cuda_cap || '80' }}) + a kernel compile for every GPU-architecture branch the toolkit supports. NOT RUN: any test, any kernel on a GPU (no NVIDIA GPU)" ;;
          esac
          echo "::notice title=scope ${{ matrix.name }}::$msg"
