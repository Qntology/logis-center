# logis-center 루트 작업 공간.
#
#   crates/             logis-* 와 직접 짠 CPU 커널(embed-cpu-kernels · ggml-kquant). Tauri · LanceDB 를 모르는 도메인 · 엔진 라이브러리 (candle · tokio 는 모델 엔진 logis-llm · 문서 비전 logis-vision-doc 만 씀)
#   apps/core           헤드리스 코어 logis-app (모델 상주 · LanceDB 저장소 · 스케줄러 · 검색, Tauri 없음)
#   apps/desktop        데스크톱 앱의 얇은 Tauri 셸 (명령 · 창 · 브라우저 자동화 · TauriSink). 프런트엔드는 web/desktop
#   apps/mobile         모바일 Tauri 셸 (작업 공간 밖). 외부 코드는 vendor/, 서버(Workers)는 workers/
#
# premium-discount · raon-zena 와 같은 candle 포크 커밋과 premium-discount-* 리비전을 쓴다.
# 빌드 산출물은 루트 target/ 에 둔다 (.cargo/config.toml 의 target-dir).
# Cloudflare Workers(workers/)는 wasm32 로 따로 빌드하는 자기 작업 공간이다.
[workspace]
resolver = "2"
members = [
    "crates/logis-schema",
    "crates/logis-bias",
    "crates/logis-sds",
    "crates/logis-parsers",
    "crates/logis-pug",
    "crates/logis-search",
    "crates/logis-llm",
    "crates/logis-vision-doc",
    "apps/core",
    "apps/desktop",
]
# 자기 [workspace] 를 가진 vendored crate 는 그 작업 공간에 남긴다 (path 의존성으로만 링크).
# 모바일 셸과 CPU 벤치는 앱과 따로 빌드한다 (모바일은 [workspace] 가 없어 여기 빼지 않으면 그 폴더의 cargo 가 실패한다).
exclude = [
    "vendor/boa-engine",
    "vendor/direct-storage",
    "apps/mobile",
    "tools/cpu-embed-bench",
    "workers",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Qntology/logis-center"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.18"
regex = "1"

# 내부 crate (crates/logis-*)
logis-schema = { path = "crates/logis-schema" }
logis-bias = { path = "crates/logis-bias" }
logis-sds = { path = "crates/logis-sds" }
logis-parsers = { path = "crates/logis-parsers" }
logis-pug = { path = "crates/logis-pug" }
logis-search = { path = "crates/logis-search" }
logis-llm = { path = "crates/logis-llm" }
logis-vision-doc = { path = "crates/logis-vision-doc" }
# 헤드리스 코어 (apps/core): 모델 상주 · 저장소 · 스케줄러 · 검색. Tauri 셸(apps/desktop)이 재수출합니다.
logis-app = { path = "apps/core" }

# premium-discount 공용 라이브러리 (raon-zena 와 같은 리비전).
# 로컬 ../premium-discount 로 같이 고칠 때는 아래 [patch."https://github.com/Qntology/premium-discount"] 의 주석을 푼다.
premium-discount-identity = { git = "https://github.com/Qntology/premium-discount", rev = "25497674a0b86756ba56a17d69a8c5173e95a6dd" }
premium-discount-sds = { git = "https://github.com/Qntology/premium-discount", rev = "25497674a0b86756ba56a17d69a8c5173e95a6dd" }
premium-discount-quant = { git = "https://github.com/Qntology/premium-discount", rev = "25497674a0b86756ba56a17d69a8c5173e95a6dd" }
# AI 엔진: Stanza (ONNX Runtime, 실행할 때 불러옴) · granite 임베딩 인코더 (candle). logis 쪽은 이 위의 얇은 층입니다.
premium-discount-nlp = { git = "https://github.com/Qntology/premium-discount", rev = "25497674a0b86756ba56a17d69a8c5173e95a6dd", default-features = false }
# 스팬 NMS (Stanza 역할 · granite 임베딩 위의 의미 NMS). 아직 쓰는 crate 는 없습니다 — 이 앱의 NMS 는 비전 패치(logis-vision-doc nms_arena)뿐.
premium-discount-nms = { git = "https://github.com/Qntology/premium-discount", rev = "25497674a0b86756ba56a17d69a8c5173e95a6dd" }

# candle-rocm-vulkan 포크: premium-discount (crates/ · app/) · raon-zena 와 같은 커밋으로 고정한다.
# 예전에는 branch = "master" 를 따라가고 커밋은 Cargo.lock 이 정했다 (60ec257, ebaf93d 의 조상).
# 포크에는 candle-core · candle-nn · candle-flash-attn · candle-backend(candle-rocm) 만 있다. candle-transformers 는
# crates.io 0.11.0 을 쓰고, 그 의존성인 candle-core · candle-nn 이 아래 패치로 포크에 합쳐진다.
# 원격에 아직 없는 로컬 포크(../candle-rocm-vulkan)로 빌드하려면 아래 git 4줄(candle-rocm 과 패치 3줄)을 path 줄로 바꾼다.
# candle-rocm 은 crates/logis-llm(장치 수 · VRAM 조회)만 쓴다 (기능 rocm).
# candle-rocm-vulkan PR 머지 전까지 포크 브랜치 커밋으로 고정 (머지 후 Qntology/candle-rocm-vulkan 동일 rev 로 전환).
# candle-rocm = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }
candle-rocm = { git = "https://github.com/sungu-che/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }

[patch.crates-io]
# candle-core = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }
# candle-nn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }
# candle-flash-attn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }
candle-core = { git = "https://github.com/sungu-che/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }
candle-nn = { git = "https://github.com/sungu-che/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }
candle-flash-attn = { git = "https://github.com/sungu-che/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }

# [patch."https://github.com/Qntology/premium-discount"]
# premium-discount-identity = { path = "../premium-discount/crates/premium-discount-identity" }
# premium-discount-sds = { path = "../premium-discount/crates/premium-discount-sds" }
# premium-discount-quant = { path = "../premium-discount/crates/premium-discount-quant" }
# premium-discount-nlp = { path = "../premium-discount/crates/premium-discount-nlp" }

[profile.dev]
opt-level = 0      # 기본값 0(최적화 없음). 무거운 crate 만 아래에서 3 으로 올린다.
incremental = true # 변경된 부분만 빌드해서 시간을 아낍니다.

[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f64]
opt-level = 3
[profile.dev.package.embed-cpu-kernels]
opt-level = 3
[profile.dev.package.ggml-kquant]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
# hash_id(secp256k1) 를 시험에서 수천 번 부르면 debug 에서 수십 초가 걸린다.
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.tiny-keccak]
opt-level = 3

[profile.release]
opt-level = 3   # 실행 속도 최대
strip = true      # 모든 심볼 제거 (함수 이름 등 삭제)
lto = true        # 전체 프로그램 최적화 (코드 분석을 훨씬 어렵게 함)
panic = "abort"   # 에러 발생 시 정보를 남기지 않음
codegen-units = 1 # 빌드 속도 개선
